[package]
name = "payme-contract"
description = "PayMe: privacy-preserving invoice registry and NEAR payments (testnet)"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
# Same version near-sdk 5.30.1 uses; only for RuntimeFeesConfig in callback tests.
near-parameters = "=0.38.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
